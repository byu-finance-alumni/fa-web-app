# Weekly CodeQL for fa-web-app. CodeQL ONLY — this workflow does not notify.
#
# ⚠️ THE REST OF THIS REPO'S WEEKLY AUDIT LIVES IN fa-web-api. That workflow
# clones this repo and runs THIS repo's own scripts against it
# (scripts/security-scan.mjs, scripts/audit-prod.mjs, scripts/security-report.mjs),
# then posts ONE Slack message covering both codebases. Two workflows posting
# meant two messages every Sunday answering a single question, so the reporting
# was consolidated there. The checks were not reduced — they moved.
#
# WHY THIS FILE STILL EXISTS AT ALL: CodeQL results have to be uploaded from the
# repository they describe, or they never appear in that repo's Security tab.
# That is the one part of the audit that cannot be run from the other repo.
#
# ⚠️ DO NOT ADD A SLACK STEP HERE. If this repo needs to say something of its
# own, change the message in fa-web-api instead — otherwise the "one message a
# week" property quietly goes away and nobody notices until Sunday.
#
# ⚠️ A SCHEDULED WORKFLOW ONLY RUNS FROM THE DEFAULT BRANCH, which here is
# `prod`. This file does nothing on `dev`; use the Run workflow button to test.
name: Weekly CodeQL

on:
  schedule:
    # Half an hour before the fa-web-api audit, so this repo's Security tab is
    # already up to date when that run reports on both.
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds the lower-confidence security queries. This
          # is the weekly job, not the merge gate, so the extra noise is
          # affordable and the extra coverage is the point.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
