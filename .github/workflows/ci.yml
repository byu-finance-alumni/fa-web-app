name: CI

# Gates code entering the long-lived branches. Mirrors fa-web-api/ci.yml:
#   - PR into dev:  BASE checks must pass (lint, typecheck, build)
#   - PR into prod: BASE checks PLUS the prod-only tier (dependency audit)
#
# "Will it break on Vercel?" is verified by Vercel's own GitHub deployment
# check (each branch deploys to its own Vercel project), which is required
# separately via branch protection — not duplicated here.
on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

# Read-only token; CI never needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24" # matches the Vercel project's Node runtime

jobs:
  # ---------------------------------------------------------------------------
  # BASE TIER — required for BOTH dev and prod.
  # ---------------------------------------------------------------------------
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Clean, lockfile-faithful install (fails if package-lock.json is out of sync).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests (vitest). Fast, runs before the heavier build.
      - name: Test
        run: npm test

      # Next.js production build — the same build Vercel runs, so a green build
      # here means the Vercel deploy will not break on a compile/build error.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

  # ---------------------------------------------------------------------------
  # API CONTRACT DRIFT — required for BOTH dev and prod.
  # The committed src/types/api.gen.ts is generated from fa-web-api's OpenAPI
  # schema and is what the frontend type-checks against. If the backend's shape
  # changes but this file wasn't regenerated + committed, the frontend is
  # type-checking against a stale contract — exactly how the dashboard-birthdays
  # and /admin/users crashes shipped green. This job regenerates from the served
  # schema and fails on any drift, forcing a regen (which then makes `tsc` fail
  # on any stale usage). See scripts/gen-api-types.mjs and issue #99.
  api-contract:
    name: API types in sync with backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate from the live backend schema. Retry to ride out a cold
      # serverless start or transient blip on the deployed API (the schema URL
      # defaults to the dev deployment; override via the API_SCHEMA_URL secret).
      - name: Regenerate API types from served schema
        env:
          API_SCHEMA_URL: ${{ secrets.API_SCHEMA_URL }}
        run: |
          ok=
          for attempt in 1 2 3; do
            if npm run gen:api-types; then ok=1; break; fi
            echo "::warning::gen:api-types attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::Could not fetch the backend OpenAPI schema after 3 attempts."
            exit 1
          fi

      - name: Fail if committed types drifted from the backend
        run: |
          if ! git diff --exit-code -- src/types/api.gen.ts; then
            echo "::error::src/types/api.gen.ts is out of sync with the backend OpenAPI schema."
            echo "The backend contract changed. Run 'npm run gen:api-types', commit the result,"
            echo "and fix any resulting 'tsc' errors before merging."
            exit 1
          fi
          echo "OK: API types match the backend schema."

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit, not just the tip
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Scan for committed secrets
        run: gitleaks detect --redact --no-banner --verbose

  hygiene:
    name: Repo hygiene (no scratch artifacts)
    runs-on: ubuntu-latest
    # dev is the AI/testing sandbox and promotes to prod (real alumni data), so
    # throwaway test/scratch files must never be committed. Fails if any tracked
    # file looks like a scratch artifact. Legit tests live in lowercase tests/,
    # which these uppercase patterns do not match.
    steps:
      - uses: actions/checkout@v4
      - name: Block scratch / throwaway test files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(TEST_[^/]*|SCRATCH[^/]*|DRAFT_[^/]*|[^/]*\.scratch|\.board-seed[^/]*|[^/]*DO_NOT_MERGE[^/]*)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Scratch/throwaway files must not be committed — dev promotes to prod:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no scratch/test artifacts tracked"

  # ---------------------------------------------------------------------------
  # PROD-ONLY TIER — extra hardening required only when promoting to prod.
  # Runs on PRs targeting prod and on direct pushes to prod. Do NOT mark this
  # check "required" on the dev branch — it is skipped there and a skipped
  # required check would block dev merges forever.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (prod only)
    if: github.base_ref == 'prod' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail only on high/critical advisories so routine low-severity noise
      # doesn't block releases. Runtime deps only (--omit=dev).
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
